<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" font-family="DejaVu Sans, Arial, sans-serif">
  <style>
    .v { font-size:13px; font-weight:bold; fill:#10263f; }
    .l { font-size:11.5px; fill:#37474f; }
    .n { font-size:10px; fill:#5b6b7a; }
  </style>
  <text x="20" y="22" font-size="12.5" font-weight="bold" fill="#10263f">ENERGY LEDGER &#8212; 30 km shot [SIMULATION]</text>

  <!-- scale: 875 J -> 470 px, x0=200 -->
  <!-- Bank -->
  <rect x="200" y="46" width="470" height="34" fill="#eef2f6" stroke="#8a97a5" stroke-width="1.4"/>
  <text x="190" y="68" text-anchor="end" class="l">Supercap bank</text>
  <text x="196" y="94" text-anchor="end" class="n">0.6 F @ 54 V</text>
  <text x="662" y="68" text-anchor="end" class="v">875 J</text>

  <!-- Consumed -->
  <rect x="200" y="118" width="185" height="34" fill="#e87722" stroke="#b45a12"/>
  <text x="190" y="140" text-anchor="end" class="l">Consumed</text>
  <text x="196" y="166" text-anchor="end" class="n">electronics + hold + slews</text>
  <text x="392" y="140" class="v" fill="#7a4a10">344 J</text>

  <!-- Remaining -->
  <rect x="200" y="190" width="167" height="34" fill="#2e8b57" stroke="#1d5a38"/>
  <text x="190" y="212" text-anchor="end" class="l">Left at impact</text>
  <text x="196" y="238" text-anchor="end" class="n">end-of-flight cap margin</text>
  <text x="374" y="212" class="v" fill="#1d5a38">310 J (35%)</text>

  <!-- gridlines every 250 J -> 134.3px -->
  <g stroke="#dfe6ee" stroke-width="1">
    <line x1="334" y1="40" x2="334" y2="240"/>
    <line x1="468" y1="40" x2="468" y2="240"/>
    <line x1="603" y1="40" x2="603" y2="240"/>
  </g>
  <g font-size="9" fill="#8a97a5">
    <text x="334" y="252" text-anchor="middle">250 J</text>
    <text x="468" y="252" text-anchor="middle">500 J</text>
    <text x="603" y="252" text-anchor="middle">750 J</text>
  </g>

  <text x="20" y="278" class="n">Generated in ascent: 412 J + 155 J regen braking &#183; spec-sheet ledger (conservative): ~28% margin</text>
  <text x="20" y="292" class="n">Closes at 20 km (25% margin) and 40 km (20% margin) too.</text>
</svg>
